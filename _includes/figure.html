<figure class="figure  figure--{{ include.position | default: 'center' }}">
  <img class="image" src="{{ include.image }}" alt="{{ include.alt | default: include.caption }}" {% if include.width %}width="{{ include.width }}"{% endif %} {% if include.height %}height="{{ include.height }}"{% endif %}>
  {% if include.caption %}<figcaption class="caption">{{ include.caption }}</figcaption>{% endif %}
</figure>
